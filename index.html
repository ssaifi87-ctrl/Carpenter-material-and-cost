<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Furniture & Doc Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #121212; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .btn { background: #00ff00; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; margin: 10px; }
        .btn:hover { background: #00cc00; }
        
        /* स्क्रीन लेआउट्स */
        #home-screen { display: block; }
        #scanner-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* स्कैनिंग स्क्वायर और लेज़र एनीमेशन */
        .scan-container { position: absolute; top: 15%; left: 10%; width: 80%; height: 60%; border: 3px solid #00ff00; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); border-radius: 8px; overflow: hidden; }
        .laser-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(0, 255, 0, 0.8); box-shadow: 0 0 15px #00ff00; animation: scanAnimation 2s infinite linear; }
        
        @keyframes scanAnimation {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        
        /* रिजल्ट और सेटिंग्स स्क्रीन */
        #result-screen { display: none; background: #1e1e1e; padding: 20px; border-radius: 15px; max-width: 500px; margin: 0 auto; width: 100%; }
        .preview-box { width: 100%; max-height: 250px; border: 2px solid #333; margin-bottom: 20px; border-radius: 8px; display: none; object-fit: contain; background: #000; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        select, input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; }
        
        .status-text { font-size: 22px; color: #00ff00; font-weight: bold; margin-bottom: 15px; }
        
        /* सोफा ऑप्शंस लिस्ट स्टाइल */
        .sub-options-list { margin-top: 10px; background: #151515; border-radius: 8px; padding: 10px; display: none; text-align: left; max-height: 200px; overflow-y: auto; }
        .sub-item { padding: 8px; border-bottom: 1px solid #222; font-size: 15px; color: #ddd; }
        .sub-item:last-child { border: none; }
    </style>
</head>
<body>

    <!-- 1. होम स्क्रीन -->
    <div id="home-screen">
        <h1>दस्तावेज़ एवं फ़र्नीचर स्कैनर</h1>
        <p style="color: #888; margin: 15px 0 25px;">डॉक्यूमेंट स्कैन करें और सोफा सेट कैटलॉग देखें</p>
        
        <!-- मुख्य स्कैन बटन -->
        <button class="btn" onclick="startScanning()">Scan Document</button>
        
        <hr style="border: 1px solid #222; margin: 25px 0;">

        <!-- फ़र्नीचर ऑप्शंस सेक्शन -->
        <div class="form-group">
            <label style="font-size: 16px; font-weight: bold; color: #00ff00;">मुख्य फ़र्नीचर चुनें (10 विकल्प):</label>
            <select id="main-furniture-select" onchange="loadSubOptions()">
                <option value="">-- कृपया एक विकल्प चुनें --</option>
                <option value="mandir_sofa">1. Mandir Sofa Set (मंदिर सोफा सेट)</option>
                <option value="luxury_sofa">2. Luxury L-Shape Sofa</option>
                <option value="wooden_sofa">3. Traditional Wooden Sofa</option>
                <option value="modern_recliner">4. Modern Recliner Set</option>
                <option value="chesterfield">5. Classic Chesterfield</option>
                <option value="sofa_bed">6. Convertible Sofa Bed</option>
                <option value="office_sofa">7. Executive Office Sofa</option>
                <option value="velvet_lounge">8. Premium Velvet Lounge</option>
                <option value="compact_2seater">9. Compact 2-Seater Sofa</option>
                <option value="modular_sectional">10. Modular Sectional Sofa</option>
            </select>
        </div>

        <!-- सब-ऑप्शंस दिखाने का बॉक्स -->
        <div id="sub-options-container" class="sub-options-list"></div>
    </div>

    <!-- 2. लाइव कैमरा और लेज़र स्क्रीन -->
    <div id="scanner-screen">
        <video id="camera-view" autoplay playsinline></video>
        <div class="scan-container">
            <div class="laser-line"></div>
        </div>
    </div>

    <!-- 3. स्कैन कम्प्लीट और सेव स्क्रीन (Assemble विकल्प यहाँ से हटा दिया गया है) -->
    <div id="result-screen">
        <div class="status-text">✓ Scan Complete</div>
        
        <!-- View बटन और प्रीव्यू इमेज -->
        <button class="btn" style="background:#555; color:#fff;" onclick="togglePreview()">View Document</button>
        <img id="doc-preview" class="preview-box" alt="Preview">

        <!-- फॉर्मेट और क्वालिटी सेटिंग्स -->
        <div class="form-group" style="margin-top: 15px;">
            <label>फाइल फॉर्मेट चुनें (Save As)</label>
            <select id="file-format">
                <option value="pdf">PDF Document (.pdf)</option>
                <option value="jpg">Image (.jpg)</option>
                <option value="gif">Animation (.gif)</option>
            </select>
        </div>

        <div class="form-group">
            <label>रेजोल्यूशन (Quality)</label>
            <select id="file-resolution">
                <option value="high">High Resolution (1080p)</option>
                <option value="medium">Medium Resolution (720p)</option>
                <option value="low">Low Resolution (480p)</option>
            </select>
        </div>

        <div class="form-group">
            <label>फाइल का नाम (Rename)</label>
            <input type="text" id="file-name" value="Scanned_Doc_1">
        </div>

        <!-- अंतिम सेव बटन -->
        <button class="btn" onclick="saveDocument()">Save Document</button>
    </div>
