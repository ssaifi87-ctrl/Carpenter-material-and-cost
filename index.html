<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saifi Carpenter Budget Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; text-align: center; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        h1 { color: #00ff00; margin-bottom: 10px; font-size: 24px; }
        p { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        .btn { background: #00ff00; color: #000; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.3s; width: 100%; margin: 10px 0; }
        .btn:hover { background: #00cc00; }
        .btn-back { background: #555; color: #fff; }
        .btn-back:hover { background: #444; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; }
        .result-box { margin-top: 20px; padding: 15px; background: #252525; border-radius: 8px; border: 1px dashed #00ff00; font-size: 18px; font-weight: bold; color: #00ff00; display: none; }
        
        /* स्क्रीन नेविगेशन */
        .screen { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. होम स्क्रीन -->
        <div id="home-screen" class="screen active">
            <h1>सैफी कारपेंटर बजट कैलकुलेटर</h1>
            <p>कृपया बजट बनाने के लिए नीचे दी गई कैटेगरी में से कोई एक चुनें:</p>
            <button class="btn" onclick="showScreen('almari-screen')">1. अलमारी का बजट (Almari Budget)</button>
            <button class="btn" onclick="showScreen('kitchen-screen')">2. मॉड्यूलर किचन बजट (Kitchen Budget)</button>
        </div>

        <!-- 2. अलमारी बजट स्क्रीन -->
        <div id="almari-screen" class="screen">
            <h1>अलमारी बजट कैलकुलेटर</h1>
            <p>Dimensions और Rate दर्ज करें</p>
            
            <div class="form-group">
                <label>चौड़ाई (Width - फीट में):</label>
                <input type="number" id="almari-width" placeholder="उदाहरण: 6">
            </div>
            <div class="form-group">
                <label>ऊँचाई (Height - फीट में):</label>
                <input type="number" id="almari-height" placeholder="उदाहरण: 7">
            </div>
            <div class="form-group">
                <label>Quotation Rate (प्रति स्क्वेयर फीट):</label>
                <input type="number" id="almari-rate" placeholder="उदाहरण: 1200">
            </div>
            
            <button class="btn" onclick="calculateAlmari()">बजट कैलकुलेट करें</button>
            <div id="almari-result" class="result-box"></div>
            <button class="btn btn-back" onclick="showScreen('home-screen')">← वापस जाएँ</button>
        </div>

        <!-- 3. किचन बजट स्क्रीन -->
        <div id="kitchen-screen" class="screen">
            <h1>किचन बजट कैलकुलेटर</h1>
            <p>किचन का साइज़ और रेट दर्ज करें</p>
            
            <div class="form-group">
                <label>किचन की कुल लम्बाई (Running Feet):</label>
                <input type="number" id="kitchen-length" placeholder="उदाहरण: 10">
            </div>
            <div class="form-group">
                <label>मटीरियल टाइप (Material Type):</label>
                <select id="kitchen-material">
                    <option value="standard">Standard Plywood (नॉर्मल प्लाई)</option>
                    <option value="premium">Premium Waterproof (वाटरप्रूफ प्लाई)</option>
                    <option value="hdmr">HDMR Board (हाई क्वालिटी बोर्ड)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quotation Rate (प्रति रनिंग फीट):</label>
                <input type="number" id="kitchen-rate" placeholder="उदाहरण: 2500">
            </div>
            
            <button class="btn" onclick="calculateKitchen()">बजट कैलकुलेट करें</button>
            <div id="kitchen-result" class="result-box"></div>
            <button class="btn btn-back" onclick="showScreen('home-screen')">← वापस जाएँ</button>
        </div>
    </div>

    <script>
        // स्क्रीन बदलने का फंक्शन (अलमारी और किचन का अलग-अलग पेज)
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('home-screen');
        });

        function showScreen(screenId) {
            // सभी स्क्रीन छुपाएं
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            
            // चुनी हुई स्क्रीन दिखाएं
            const activeScreen = document.getElementById(screenId);
            if (activeScreen) {
                activeScreen.classList.add('active');
            }
            
            // पुराने रिजल्ट्स साफ करें
            document.getElementById('almari-result').style.display = 'none';
            document.getElementById('kitchen-result').style.display = 'none';
        }

        // अलमारी का बजट कैलकुलेशन
        function calculateAlmari() {
            const width = parseFloat(document.getElementById('almari-width').value);
            const height = parseFloat(document.getElementById('almari-height').value);
            const rate = parseFloat(document.getElementById('almari-rate').value);

            if (isNaN(width) || isNaN(height) || isNaN(rate) || width <= 0 || height <= 0 || rate <= 0) {
                alert("कृपया सभी फील्ड्स में सही संख्या दर्ज करें।");
                return;
            }

            const totalArea = width * height;
            const totalBudget = totalArea * rate;

            const resultBox = document.getElementById('almari-result');
            resultBox.innerHTML = `कुल एरिया: ${totalArea.toFixed(2)} Sq.Ft.<br>अनुमानित बजट: ₹${totalBudget.toLocaleString('en-IN')}/-`;
            resultBox.style.display = 'block';
        }

        // किचन का बजट कैलकुलेशन
        function calculateKitchen() {
            const length = parseFloat(document.getElementById('kitchen-length').value);
            const rate = parseFloat(document.getElementById('kitchen-rate').value);
            const material = document.getElementById('kitchen-material').value;

            if (isNaN(length) || isNaN(rate) || length <= 0 || rate <= 0) {
                alert("कृपया सभी फील्ड्स में सही संख्या दर्ज करें।");
                return;
            }

            // मटीरियल के हिसाब से थोड़ा एक्स्ट्रा चार्ज (लॉजिक के लिए)
            let materialMultiplier = 1.0;
            if (material === 'premium') materialMultiplier = 1.2;
            if (material === 'hdmr') materialMultiplier = 1.35;

            const totalBudget = length * rate * materialMultiplier;

            const resultBox = document.getElementById('kitchen-result');
            resultBox.innerHTML = `कुल लम्बाई: ${length} Running Ft.<br>अनुमानित बजट: ₹${Math.round(totalBudget).toLocaleString('en-IN')}/-`;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
