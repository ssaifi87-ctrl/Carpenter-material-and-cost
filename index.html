<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saifi Carpenter Premium Calculator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eef2f3; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .switch-link { text-align: center; margin-top: 15px; color: #007bff; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .hidden { display: none; }
        .record-card { background: #f8f9fa; border-left: 5px solid #28a745; padding: 15px; margin-top: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .record-img, .preview-visual { max-width: 100%; height: auto; border-radius: 8px; margin-top: 12px; display: block; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        .result-box { background: #d4edda; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; color: #155724; font-size: 16px; }
        .photo-container { margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- 🔑 लॉगिन स्क्रीन -->
    <div id="login-screen">
        <h2>Saifi Carpenter लॉगिन</h2>
        <label>यूज़रनेम:</label>
        <input type="text" id="login-user" placeholder="अपना यूज़रनेम डालें">
        <label>पासवर्ड:</label>
        <input type="password" id="login-pass" placeholder="अपना पासवर्ड डालें">
        <button onclick="auth('/api/login', 'login-user', 'login-pass')">लॉगिन करें</button>
        <div class="switch-link" onclick="toggleScreen(false)">नया अकाउंट (Sign Up) बनाएं</div>
    </div>

    <!-- 📝 साइनअप स्क्रीन -->
    <div id="signup-screen" class="hidden">
        <h2>नया कारपेंटर अकाउंट</h2>
        <label>यूज़रनेम चुनें:</label>
        <input type="text" id="signup-user" placeholder="उदा. saifi_furniture">
        <label>पासवर्ड बनाएं:</label>
        <input type="password" id="signup-pass" placeholder="कम से कम 4 अक्षर">
        <button class="btn-success" onclick="auth('/api/signup', 'signup-user', 'signup-pass', true)">अकाउंट रजिस्टर करें</button>
        <div class="switch-link" onclick="toggleScreen(true)">अकाउंट है? लॉगिन करें</div>
    </div>

    <!-- 📊 कारपेंटर डैशबोर्ड (लॉगिन के बाद) -->
    <div id="dashboard-screen" class="hidden">
        <h2 id="welcome-msg">खाता चालू है</h2>
        <hr>
        
        <h3>📐 बजट और Realistic लुक</h3>
        
        <label>काम का प्रकार चुनें:</label>
        <select id="work-type" onchange="updateRealisticView()">
            <option value="wardrobe">अलमारी / वार्डरोब (Wardrobe)</option>
            <option value="kitchen">मॉड्यूलर किचन (Modular Kitchen)</option>
            <option value="door">डिजाइनर दरवाजा (Premium Door)</option>
        </select>

        <label>मटीरियल और फिनिश क्वालिटी:</label>
        <select id="material-quality">
            <option value="normal">नॉर्मल फिनिश (कमर्शियल प्लाई + सनमाइका)</option>
            <option value="luxury">लक्ज़री फिनिश (वाटरप्रूफ प्लाई + एक्रिलिक/लैमिनेट)</option>
            <option value="ultra">अल्ट्रा प्रीमियम (HDMR + पीयू पॉलिश/विनियर)</option>
        </select>
        
        <!-- 🖼️ Realistic फोटो बॉक्स -->
        <div class="photo-container">
            <label style="margin-top:0; text-align:left;">Realistic डिज़ाइन प्रीव्यू:</label>
            <img id="realistic-view" class="preview-visual" src="https://unsplash.com" alt="Realistic Concept">
        </div>

        <label style="margin-top:20px;">चौड़ाई (फिट में):</label>
        <input type="number" id="width" placeholder="उदा. 6" value="6">
        
        <label>ऊंचाई (फिट में):</label>
        <input type="number" id="height" placeholder="उदा. 7" value="7">
        
        <button onclick="calculateBudget()">बजट का अनुमान लगाएं</button>
        <div id="calc-result" class="result-box hidden"></div>

        <label style="margin-top:25px;">ग्राहक का नाम (रिकॉर्ड रखने के लिए):</label>
        <input type="text" id="job-title" placeholder="उदा. शर्मा जी का फ्लैट काम">
        
        <label>साइट की असली फोटो अपलोड करें (यदि उपलब्ध हो):</label>
        <input type="file" id="job-photo" accept="image/*">
        
        <button class="btn-success" onclick="saveRecord()">हिसाब और फोटो डेटाबेस में सेव करें</button>
        
        <hr style="margin-top: 30px;">
        <h3>📁 आपके पुराने रिकॉर्ड्स (तिजोरी)</h3>
        <div id="records-list">लोड हो रहा है...</div>
        
        <button class="btn-danger" onclick="logout()">सुरक्षित लॉगआऊट (Logout)</button>
    </div>
</div>

<script>
    let loggedInUser = null;
    let lastCalculatedBudget = 0;

    // Realistic फोटो लिंक्स (Unsplash से ली गई हाई-क्वालिटी फिनिशिंग इमेजेस)
    const realisticPhotos = {
        wardrobe: "https://unsplash.com",
        kitchen: "https://unsplash.com",
        door: "https://unsplash.com"
    };

    // काम बदलने पर Realistic फोटो चेंज करना
    function updateRealisticView() {
        const work = document.getElementById('work-type').value;
        document.getElementById('realistic-view').src = realisticPhotos[work];
    }

    function toggleScreen(showLogin) {
        document.getElementById('login-screen').classList.toggle('hidden', !showLogin);
        document.getElementById('signup-screen').classList.toggle('hidden', showLogin);
    }

    async function auth(url, userField, passField, isSignup = false) {
        const username = document.getElementById(userField).value.trim();
        const password = document.getElementById(passField).value.trim();
        if(!username || !password) return alert("कृपया दोनों बॉक्स भरें");

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if(res.ok) {
            alert(data.message || "लॉगिन सफल!");
            if(!isSignup) {
                loggedInUser = data.username;
                showDashboard();
            } else { toggleScreen(true); }
        } else { alert(data.error); }
    }

    function calculateBudget() {
        const work = document.getElementById('work-type').value;
        const quality = document.getElementById('material-quality').value;
        const w = parseFloat(document.getElementById('width').value);
        const h = parseFloat(document.getElementById('height').value);
        
        if(!w || !h || w <= 0 || h <= 0) return alert("कृपया सही साइज दर्ज करें");
        
        // बेस रेट्स तय करना
        let baseRate = 0;
        if (work === 'wardrobe') baseRate = 1200;
        if (work === 'kitchen') baseRate = 1500;
        if (work === 'door') baseRate = 800;

        // मटीरियल क्वालिटी के हिसाब से रेट बढ़ाना
        let multiplier = 1.0;
        if (quality === 'luxury') multiplier = 1.4; // 40% ज्यादा महंगा
        if (quality === 'ultra') multiplier = 1.8;  // 80% ज्यादा महंगा

        const finalRate = baseRate * multiplier;
        lastCalculatedBudget = w * h * finalRate;
        
        const resBox = document.getElementById('calc-result');
        resBox.classList.remove('hidden');
        resBox.innerHTML = `कुल साइज: ${w*h} Sq.Ft | रेट: ₹${finalRate}/Sq.Ft<br>अनुमानित बजट: ₹${lastCalculatedBudget.toLocaleString('en-IN')}/-`;
    }

    function saveRecord() {
        const title = document.getElementById('job-title').value.trim();
        const fileInput = document.getElementById('job-photo').files;
        if(!title || lastCalculatedBudget === 0) return alert("पहले बजट निकालें और ग्राहक का नाम भरें!");

        if (fileInput.length > 0) {
            const reader = new FileReader();
            reader.onloadend = async () => {
                sendRecordToServer(title, lastCalculatedBudget, reader.result);
            };
            reader.readAsDataURL(fileInput[0]);
        } else {
            sendRecordToServer(title, lastCalculatedBudget, "");
        }
    }

    async function sendRecordToServer(title, budget, photoBase64) {
        const res = await fetch('/api/save-record', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: loggedInUser,
                title,
                budget: `₹${budget.toLocaleString('en-IN')}/-`,
                photo: photoBase64
            })
        });
        if(res.ok) {
            alert("बधाई हो! ग्राहक का रिकॉर्ड तिजोरी में सेव हो गया।");
            document.getElementById('job-title').value = '';
            document.getElementById('job-photo').value = '';
            loadRecords();
        }
    }

    async function loadRecords() {
        const res = await fetch(`/api/records/${loggedInUser}`);
